<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraping Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #results {
            margin-top: 30px;
            display: none;
        }
        
        #results.show {
            display: block;
        }
        
        .result-count {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            color: #333;
        }
        
        .result-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        
        .result-item .name {
            font-weight: 600;
            font-size: 18px;
            color: #333;
        }
        
        .result-item .phone {
            color: #667eea;
            font-weight: 600;
        }
        
        .result-item .address {
            color: #666;
            font-size: 14px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #c00;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .presets {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .presets h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .preset-btn {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 8px 16px;
            border-radius: 8px;
            margin: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .preset-btn:hover {
            background: #667eea;
            color: white;
        }
        
        @media (max-width: 600px) {
            .row {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Scraping Platform</h1>
        <p class="subtitle">Hitta personuppgifter från offentliga källor</p>
        
        <form id="scrapeForm">
            <div class="form-group">
                <label>🏙️ Välj förinställd källa</label>
                <select id="presetSelect" onchange="loadPreset()">
                    <option value="">-- Välj källa --</option>
                    <option value="eniro">Eniro</option>
                    <option value="hitta">Hitta.se</option>
                    <option value="ratsit">Ratsit</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>🌐 Sök-URL</label>
                <input type="text" id="url" placeholder="https://www.eniro.se/personer?q=stockholm">
            </div>
            
            <div class="row">
                <div class="form-group">
                    <label>📋 Resultat-selektor</label>
                    <input type="text" id="resultSelector" placeholder=".result-item">
                </div>
                <div class="form-group">
                    <label>👤 Namn-selektor</label>
                    <input type="text" id="nameSelector" placeholder=".name">
                </div>
            </div>
            
            <div class="row">
                <div class="form-group">
                    <label>📍 Adress-selektor</label>
                    <input type="text" id="addressSelector" placeholder=".address">
                </div>
                <div class="form-group">
                    <label>📱 Telefon-selektor</label>
                    <input type="text" id="phoneSelector" placeholder=".phone">
                </div>
            </div>
            
            <button type="submit" class="btn" id="scrapeBtn">🚀 Starta Scraping</button>
        </form>
        
        <div class="presets">
            <h3>⚡ Snabbval</h3>
            <button class="preset-btn" onclick="setPreset('eniro')">Eniro</button>
            <button class="preset-btn" onclick="setPreset('hitta')">Hitta.se</button>
            <button class="preset-btn" onclick="setPreset('ratsit')">Ratsit</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 20px;">⏳ Scrapar data... Detta kan ta några sekunder</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div id="results">
            <div class="result-count" id="resultCount"></div>
            <div id="resultList"></div>
        </div>
    </div>
    
    <script>
        const presets = {
            eniro: {
                url: 'https://www.eniro.se/personer?q=stockholm',
                resultSelector: '.result-item',
                nameSelector: '.name',
                addressSelector: '.address',
                phoneSelector: '.phone'
            },
            hitta: {
                url: 'https://www.hitta.se/sök?q=stockholm',
                resultSelector: '.result-card',
                nameSelector: '.result-card__title',
                addressSelector: '.result-card__address',
                phoneSelector: '.result-card__phone'
            },
            ratsit: {
                url: 'https://www.ratsit.se/sok/person?q=stockholm',
                resultSelector: '.person-row',
                nameSelector: '.name-column a',
                addressSelector: '.address-column',
                phoneSelector: '.phone-column'
            }
        };
        
        function loadPreset() {
            const select = document.getElementById('presetSelect');
            const value = select.value;
            if (value && presets[value]) {
                setPreset(value);
            }
        }
        
        function setPreset(name) {
            const preset = presets[name];
            if (!preset) return;
            
            document.getElementById('url').value = preset.url;
            document.getElementById('resultSelector').value = preset.resultSelector;
            document.getElementById('nameSelector').value = preset.nameSelector;
            document.getElementById('addressSelector').value = preset.addressSelector;
            document.getElementById('phoneSelector').value = preset.phoneSelector;
            
            // Uppdatera dropdown
            document.getElementById('presetSelect').value = name;
        }
        
        document.getElementById('scrapeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Visa loading
            document.getElementById('loading').classList.add('show');
            document.getElementById('results').classList.remove('show');
            document.getElementById('error').classList.remove('show');
            document.getElementById('scrapeBtn').disabled = true;
            
            // Samla data
            const data = {
                url: document.getElementById('url').value,
                result_selector: document.getElementById('resultSelector').value,
                name_selector: document.getElementById('nameSelector').value,
                address_selector: document.getElementById('addressSelector').value,
                phone_selector: document.getElementById('phoneSelector').value
            };
            
            try {
                const response = await fetch('/scrape', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                // Dölj loading
                document.getElementById('loading').classList.remove('show');
                document.getElementById('scrapeBtn').disabled = false;
                
                if (result.success) {
                    // Visa resultat
                    document.getElementById('resultCount').textContent = `✅ Hittade ${result.count} personer med telefonnummer`;
                    document.getElementById('resultList').innerHTML = result.results.map(person => `
                        <div class="result-item">
                            <div class="name">${person.name || 'Okänd'}</div>
                            <div class="phone">📱 ${person.phone || 'Saknas'}</div>
                            <div class="address">📍 ${person.address || 'Saknas'}</div>
                        </div>
                    `).join('');
                    document.getElementById('results').classList.add('show');
                } else {
                    // Visa fel
                    document.getElementById('error').textContent = '❌ ' + result.error;
                    document.getElementById('error').classList.add('show');
                }
            } catch (error) {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('scrapeBtn').disabled = false;
                document.getElementById('error').textContent = '❌ Nätverksfel: ' + error.message;
                document.getElementById('error').classList.add('show');
            }
        });
    </script>
</body>
</html>
