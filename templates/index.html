<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraping Platform</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #222;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 4px;
            color: #3a3a7c;
        }

        .subtitle {
            color: #666;
            margin-bottom: 28px;
            font-size: 0.95rem;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 28px 32px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input[type="text"],
        select {
            padding: 10px 14px;
            border: 1.5px solid #dde1e9;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            background: #fafbfc;
            width: 100%;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: #667eea;
            background: #fff;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 7px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            width: 100%;
            justify-content: center;
            margin-top: 8px;
            padding: 14px;
            font-size: 1.05rem;
        }

        .btn-csv {
            background: #22a87a;
            color: #fff;
        }

        /* ── Progress box ───────────────────────────────────────── */
        #progressBox {
            display: none;
            background: #eef0ff;
            border-left: 4px solid #667eea;
            border-radius: 7px;
            padding: 18px 20px;
            margin-bottom: 16px;
        }

        .progress-headline {
            font-weight: 600;
            color: #4a4aa0;
            margin-bottom: 10px;
            font-size: 0.97rem;
        }

        .progress-bar-track {
            background: #d8dcf5;
            border-radius: 99px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 99px;
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-log {
            font-size: 0.85rem;
            color: #5a5a9a;
            max-height: 80px;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse; /* newest at top */
        }

        .progress-log .log-line {
            padding: 1px 0;
        }

        /* ── Status messages ────────────────────────────────────── */
        .status {
            display: none;
            padding: 14px 18px;
            border-radius: 7px;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }

        .status.error {
            background: #fff0f0;
            color: #c0392b;
            border-left: 4px solid #e74c3c;
        }

        .status.warning {
            background: #fffbea;
            color: #7a5800;
            border-left: 4px solid #f0b429;
        }

        /* ── Results ─────────────────────────────────────────────── */
        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .results-header h2 {
            font-size: 1.1rem;
            color: #3a3a7c;
        }

        .results-count {
            font-size: 0.9rem;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        thead tr {
            background: #f4f5fb;
        }

        th {
            padding: 10px 14px;
            text-align: left;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
            border-bottom: 2px solid #e8eaf0;
        }

        td {
            padding: 10px 14px;
            border-bottom: 1px solid #f0f2f5;
            vertical-align: top;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8f9ff; }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 0;
            font-size: 0.95rem;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: 1; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Scraping Platform</h1>
    <p class="subtitle">Hämta personuppgifter från offentliga svenska källor</p>

    <div class="card">
        <form id="scrapeForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>🏙️ Stad</label>
                    <input type="text" id="stad" placeholder="t.ex. Stockholm" required>
                </div>

                <div class="form-group">
                    <label>📡 Källa</label>
                    <select id="kalla">
                        <option value="1">Eniro</option>
                        <option value="2">Hitta.se</option>
                        <option value="3">Ratsit</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>📊 Max antal personer</label>
                    <select id="maxAntal">
                        <option value="100">100 (snabb test)</option>
                        <option value="1000">1 000</option>
                        <option value="5000" selected>5 000 (rekommenderas)</option>
                        <option value="10000">10 000</option>
                        <option value="9999999">Så många som möjligt</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                🚀 Starta Scraping
            </button>
        </form>
    </div>

    <!-- Live progress -->
    <div id="progressBox">
        <div class="progress-headline" id="progressHeadline">⏳ Förbereder…</div>
        <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <div class="progress-log" id="progressLog"></div>
    </div>

    <!-- Block warning banner -->
    <div class="status warning" id="statusWarning"></div>

    <!-- Error banner -->
    <div class="status error" id="statusError"></div>

    <!-- Results table -->
    <div class="card" id="resultsCard" style="display:none">
        <div class="results-header">
            <div>
                <h2>Resultat</h2>
                <span class="results-count" id="resultsCount"></span>
            </div>
            <button class="btn btn-csv" id="downloadBtn" onclick="downloadCSV()">
                ⬇️ Ladda ned CSV
            </button>
        </div>

        <div id="tableWrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Namn</th>
                        <th>Telefon</th>
                        <th>Adress</th>
                        <th>Källa</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Stores the last successful results for CSV download
    let lastResults = [];
    let currentEventSource = null;

    document.getElementById('scrapeForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        // Close any previous SSE stream
        if (currentEventSource) {
            currentEventSource.close();
            currentEventSource = null;
        }

        const stad     = document.getElementById('stad').value.trim();
        const kalla    = document.getElementById('kalla').value;
        const maxAntal = parseInt(document.getElementById('maxAntal').value);

        // Reset UI
        hide('resultsCard');
        hide('statusError');
        hide('statusWarning');
        resetProgress();
        showProgress('⏳ Startar scraping…');
        document.getElementById('submitBtn').disabled = true;

        try {
            // Start the background job
            const res = await fetch('/scrape', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ stad, kalla, max_antal: maxAntal })
            });

            const json = await res.json();

            if (!json.success) {
                hideProgress();
                document.getElementById('submitBtn').disabled = false;
                showError(json.error || 'Okänt fel från servern.');
                return;
            }

            // Open the SSE stream for this job
            listenToJob(json.job_id, maxAntal);

        } catch (err) {
            hideProgress();
            document.getElementById('submitBtn').disabled = false;
            showError('Nätverksfel: ' + err.message);
        }
    });

    function listenToJob(jobId, maxAntal) {
        const es = new EventSource('/scrape/events/' + jobId);
        currentEventSource = es;

        es.addEventListener('page_start', function(e) {
            const d = JSON.parse(e.data);
            const pct = maxAntal < 9000000
                ? Math.min(95, Math.round((d.totalt / maxAntal) * 100))
                : 0;
            updateProgress(
                `📄 Hämtar sida ${d.sida}… ${d.totalt} personer hittills`,
                pct
            );
            logLine(`Sida ${d.sida} – hämtar…`);
        });

        es.addEventListener('page_done', function(e) {
            const d = JSON.parse(e.data);
            const pct = maxAntal < 9000000
                ? Math.min(95, Math.round((d.totalt / maxAntal) * 100))
                : 0;
            updateProgress(
                `✅ Sida ${d.sida} klar — ${d.totalt} personer hittills`,
                pct
            );
            logLine(`Sida ${d.sida}: ${d.hittade} nya → ${d.totalt} totalt`);
        });

        es.addEventListener('blocked', function(e) {
            const d = JSON.parse(e.data);
            // Show a user-friendly warning; the 'done' event will also arrive
            // with block_reason set — that handler is the single point that
            // re-enables the button so we don't double-trigger it here.
            const kallaNamn = document.getElementById('kalla').selectedOptions[0]?.text || 'Källan';
            showWarning(`⚠️ ${kallaNamn} blockerade scraping (CAPTCHA / bot-skydd). Prova igen senare eller välj en annan källa.`);
        });

        es.addEventListener('no_results', function(e) {
            const d = JSON.parse(e.data);
            logLine(`Inga fler resultat på sida ${d.sida}`);
        });

        es.addEventListener('done', function(e) {
            const d = JSON.parse(e.data);
            hideProgress();
            document.getElementById('submitBtn').disabled = false;
            es.close();

            if (d.block_reason) {
                // Scraping was blocked — ensure the warning is visible even if
                // the 'blocked' and 'done' events arrived in the same TCP chunk.
                const kallaNamn = document.getElementById('kalla').selectedOptions[0]?.text || 'Källan';
                showWarning(`⚠️ ${kallaNamn} blockerade scraping (CAPTCHA / bot-skydd). Prova igen senare eller välj en annan källa.`);

                // If some pages were scraped before the block, still show and
                // preserve those partial results so the user doesn't lose them.
                if (d.results && d.results.length > 0) {
                    lastResults = d.results;
                    renderTable(lastResults, /* partial= */ true);
                }
                return;
            }

            lastResults = d.results || [];
            renderTable(lastResults);
        });

        es.addEventListener('error', function(e) {
            // Native SSE error (connection drop) OR our custom error event
            let msg = 'Anslutningen avbröts oväntat.';
            if (e.data) {
                try { msg = JSON.parse(e.data).message || msg; } catch(_) {}
            }
            hideProgress();
            document.getElementById('submitBtn').disabled = false;
            showError(msg);
            es.close();
        });
    }

    function renderTable(results, partial) {
        const tbody = document.getElementById('resultsBody');

        if (results.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Inga personer hittades. Prova en annan stad eller källa.</td></tr>';
        } else {
            tbody.innerHTML = results.map((p, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${esc(p.name) || '<em>Okänd</em>'}</td>
                    <td>${esc(p.phone) || '–'}</td>
                    <td>${esc(p.address) || '–'}</td>
                    <td>${esc(p.source) || '–'}</td>
                </tr>
            `).join('');
        }

        const countEl = document.getElementById('resultsCount');
        const countText = results.length === 1 ? '1 person' : `${results.length} personer`;
        countEl.textContent = partial ? `${countText} (delvisa resultat — scraping avbröts)` : countText;

        show('resultsCard');
    }

    async function downloadCSV() {
        if (!lastResults.length) return;

        try {
            const res = await fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ results: lastResults })
            });

            if (!res.ok) {
                const err = await res.json();
                showError(err.error || 'Kunde inte skapa CSV.');
                return;
            }

            const blob = await res.blob();
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href     = url;
            a.download = 'personer.csv';
            a.click();
            URL.revokeObjectURL(url);

        } catch (err) {
            showError('Nedladdningsfel: ' + err.message);
        }
    }

    // ── Progress helpers ──────────────────────────────────────────────────────

    function showProgress(headline) {
        document.getElementById('progressBox').style.display = 'block';
        document.getElementById('progressHeadline').textContent = headline;
    }

    function hideProgress() {
        document.getElementById('progressBox').style.display = 'none';
    }

    function resetProgress() {
        document.getElementById('progressHeadline').textContent = '⏳ Förbereder…';
        document.getElementById('progressBarFill').style.width = '0%';
        document.getElementById('progressLog').innerHTML = '';
    }

    function updateProgress(headline, pct) {
        document.getElementById('progressHeadline').textContent = headline;
        if (pct > 0) {
            document.getElementById('progressBarFill').style.width = pct + '%';
        }
    }

    function logLine(text) {
        const log = document.getElementById('progressLog');
        const line = document.createElement('div');
        line.className = 'log-line';
        line.textContent = text;
        log.prepend(line);
    }

    // ── Generic helpers ───────────────────────────────────────────────────────

    function show(id) {
        document.getElementById(id).style.display = '';
    }

    function hide(id) {
        document.getElementById(id).style.display = 'none';
    }

    function showError(msg) {
        const el = document.getElementById('statusError');
        el.textContent = '❌ ' + msg;
        el.style.display = 'block';
    }

    function showWarning(msg) {
        const el = document.getElementById('statusWarning');
        el.textContent = msg;
        el.style.display = 'block';
    }

    function esc(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
</script>
</body>
</html>
