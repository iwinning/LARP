<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraping Platform</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #222;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 4px;
            color: #3a3a7c;
        }

        .subtitle {
            color: #666;
            margin-bottom: 28px;
            font-size: 0.95rem;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 28px 32px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input[type="text"],
        select {
            padding: 10px 14px;
            border: 1.5px solid #dde1e9;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            background: #fafbfc;
            width: 100%;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: #667eea;
            background: #fff;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 7px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            width: 100%;
            justify-content: center;
            margin-top: 8px;
            padding: 14px;
            font-size: 1.05rem;
        }

        .btn-csv {
            background: #22a87a;
            color: #fff;
        }

        .status {
            display: none;
            padding: 14px 18px;
            border-radius: 7px;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }

        .status.loading {
            background: #eef0ff;
            color: #4a4aa0;
            border-left: 4px solid #667eea;
        }

        .status.error {
            background: #fff0f0;
            color: #c0392b;
            border-left: 4px solid #e74c3c;
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .results-header h2 {
            font-size: 1.1rem;
            color: #3a3a7c;
        }

        .results-count {
            font-size: 0.9rem;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        thead tr {
            background: #f4f5fb;
        }

        th {
            padding: 10px 14px;
            text-align: left;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
            border-bottom: 2px solid #e8eaf0;
        }

        td {
            padding: 10px 14px;
            border-bottom: 1px solid #f0f2f5;
            vertical-align: top;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8f9ff; }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 0;
            font-size: 0.95rem;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: 1; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Scraping Platform</h1>
    <p class="subtitle">Hämta personuppgifter från offentliga svenska källor</p>

    <div class="card">
        <form id="scrapeForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>🏙️ Stad</label>
                    <input type="text" id="stad" placeholder="t.ex. Stockholm" required>
                </div>

                <div class="form-group">
                    <label>📡 Källa</label>
                    <select id="kalla">
                        <option value="1">Eniro</option>
                        <option value="2">Hitta.se</option>
                        <option value="3">Ratsit</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>📊 Max antal personer</label>
                    <select id="maxAntal">
                        <option value="100">100 (snabb test)</option>
                        <option value="1000">1 000</option>
                        <option value="5000" selected>5 000 (rekommenderas)</option>
                        <option value="10000">10 000</option>
                        <option value="9999999">Så många som möjligt</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                🚀 Starta Scraping
            </button>
        </form>
    </div>

    <div class="status loading" id="statusLoading">
        ⏳ Scrapar… Det kan ta ett par minuter beroende på antal sidor.
    </div>

    <div class="status error" id="statusError"></div>

    <div class="card" id="resultsCard" style="display:none">
        <div class="results-header">
            <div>
                <h2>Resultat</h2>
                <span class="results-count" id="resultsCount"></span>
            </div>
            <button class="btn btn-csv" id="downloadBtn" onclick="downloadCSV()">
                ⬇️ Ladda ned CSV
            </button>
        </div>

        <div id="tableWrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Namn</th>
                        <th>Telefon</th>
                        <th>Adress</th>
                        <th>Källa</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Stores the last successful results for CSV download
    let lastResults = [];

    document.getElementById('scrapeForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const stad     = document.getElementById('stad').value.trim();
        const kalla    = document.getElementById('kalla').value;
        const maxAntal = parseInt(document.getElementById('maxAntal').value);

        // Reset UI
        hide('resultsCard');
        hide('statusError');
        show('statusLoading', 'loading');
        document.getElementById('submitBtn').disabled = true;

        try {
            const res = await fetch('/scrape', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ stad, kalla, max_antal: maxAntal })
            });

            const json = await res.json();
            hide('statusLoading');
            document.getElementById('submitBtn').disabled = false;

            if (!json.success) {
                showError(json.error || 'Okänt fel från servern.');
                return;
            }

            lastResults = json.results || [];
            renderTable(lastResults);

        } catch (err) {
            hide('statusLoading');
            document.getElementById('submitBtn').disabled = false;
            showError('Nätverksfel: ' + err.message);
        }
    });

    function renderTable(results) {
        const tbody = document.getElementById('resultsBody');

        if (results.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Inga personer hittades. Prova en annan stad eller källa.</td></tr>';
        } else {
            tbody.innerHTML = results.map((p, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${esc(p.name) || '<em>Okänd</em>'}</td>
                    <td>${esc(p.phone) || '–'}</td>
                    <td>${esc(p.address) || '–'}</td>
                    <td>${esc(p.source) || '–'}</td>
                </tr>
            `).join('');
        }

        document.getElementById('resultsCount').textContent =
            results.length === 1 ? '1 person' : `${results.length} personer`;

        show('resultsCard');
    }

    async function downloadCSV() {
        if (!lastResults.length) return;

        try {
            const res = await fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ results: lastResults })
            });

            if (!res.ok) {
                const err = await res.json();
                showError(err.error || 'Kunde inte skapa CSV.');
                return;
            }

            const blob = await res.blob();
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href     = url;
            a.download = 'personer.csv';
            a.click();
            URL.revokeObjectURL(url);

        } catch (err) {
            showError('Nedladdningsfel: ' + err.message);
        }
    }

    // ── helpers ──────────────────────────────────────────────────────────────

    function show(id, cls) {
        const el = document.getElementById(id);
        el.style.display = cls ? 'block' : '';
        if (cls) el.className = 'status ' + cls;
    }

    function hide(id) {
        document.getElementById(id).style.display = 'none';
    }

    function showError(msg) {
        const el = document.getElementById('statusError');
        el.textContent = '❌ ' + msg;
        el.style.display = 'block';
    }

    function esc(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
</script>
</body>
</html>
